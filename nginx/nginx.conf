# /etc/nginx/nginx.conf — internal proxy in front of the Next.js app (Nginx Proxy Manager terminates HTTPS upstream).

events {}

http {
  # Keep the scheme seen by Nginx Proxy Manager (https), not this hop's (http).
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }
  # Only upgrade the connection when the client asks for it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server_tokens off;
  # Media uploads from the administration (photos, PDF catalogue).
  client_max_body_size 25m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;

    location / {
      proxy_pass http://app:3000;

      # Host is required: the app redirects the legacy domain (fatihoune.com) by host name.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_cache_bypass $http_upgrade;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}
