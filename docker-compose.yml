# FATIHOUNE Formation — deployment with Docker Compose.
#   Pre-production : ./deploy/deploy.sh preprod      (or: docker compose --env-file .env.preprod up -d --build)
#   Production     : ./deploy/deploy.sh production
# Default: the app listens on APP_BIND:APP_PORT and an existing reverse proxy (Nginx Proxy Manager) terminates HTTPS.
# Server without a reverse proxy: add COMPOSE_PROFILES=caddy to the .env file to start the bundled Caddy on 80/443.
# Full procedure: deploy/README.md
name: fatihoune-${SITE_ENV:-preview}

services:
  app:
    build:
      context: .
      args:
        SITE_ENV: ${SITE_ENV:-preview}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    image: fatihoune-formation:${SITE_ENV:-preview}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.preprod}
    environment:
      DATABASE_URL: file:/data/fatihoune.db
      MEDIA_DIR: /data/media
    volumes:
      - data:/data
    expose:
      - '3000'
    # Published on the Docker bridge address only: reachable by the reverse proxy container, not from the internet
    # (Docker bypasses ufw, so 0.0.0.0 would expose plain HTTP publicly).
    ports:
      - '${APP_BIND:-172.17.0.1}:${APP_PORT:?APP_PORT is required (a free port on the server, e.g. 3010)}:3000'

  caddy:
    image: caddy:2.10-alpine
    profiles: ['caddy']
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    volumes:
      - ./deploy/${CADDYFILE:-Caddyfile.preprod}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # Daily backup of the database (consistent SQLite snapshot) and uploaded media; keeps 14 days.
  backup:
    image: alpine:3.22
    restart: unless-stopped
    volumes:
      - data:/data:ro
      - ./backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          stamp=$$(date +%F)
          sqlite3 /data/fatihoune.db ".backup /backups/fatihoune-$$stamp.db" \
            && tar -czf /backups/media-$$stamp.tar.gz -C /data media \
            && echo "backup $$stamp ok"
          find /backups -type f -mtime +14 -delete
          sleep 86400
        done

volumes:
  data:
  caddy_data:
  caddy_config:
