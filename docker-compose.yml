# FATIHOUNE Formation — Docker Compose stack (team convention: app + nginx, Nginx Proxy Manager in front).
# Use the Makefile:  make env  →  edit .env.production  →  make deploy        (ENV=preprod for pre-production)
# Full procedure: deploy/README.md
#
# No database container: the site uses SQLite, stored with the uploaded media in the "data" volume.
name: fatihoune-${SITE_ENV:-preview}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_ENV: ${SITE_ENV:-preview}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    image: fatihoune-formation:${SITE_ENV:-preview}
    restart: always
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: file:/data/fatihoune.db
      MEDIA_DIR: /data/media
    volumes:
      - data:/data
    expose:
      - '3000'

  nginx_proxy:
    image: nginx:stable-alpine
    restart: always
    # Port given to Nginx Proxy Manager. Bound to the Docker bridge address by default: NPM (in Docker) reaches it,
    # the internet does not — Docker bypasses ufw, so a plain "3018:80" would expose the site over HTTP without NPM.
    ports:
      - '${APP_BIND:-172.17.0.1}:${APP_PORT:?APP_PORT is required (a free port on the server, e.g. 3018)}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # Daily backup of the database (consistent SQLite snapshot) and uploaded media; keeps 14 days.
  backup:
    image: alpine:3.22
    restart: always
    volumes:
      - data:/data:ro
      - ./backups:/backups
    # Start once the app has created the database (a backup of a missing file would leave an empty file for a day).
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          stamp=$$(date +%F)
          if [ -s /data/fatihoune.db ]; then
            sqlite3 /data/fatihoune.db ".backup /backups/fatihoune-$$stamp.db" \
              && tar -czf /backups/media-$$stamp.tar.gz -C /data media \
              && echo "backup $$stamp ok" \
              || { echo "backup $$stamp FAILED"; rm -f /backups/fatihoune-$$stamp.db /backups/media-$$stamp.tar.gz; }
          else
            echo "backup $$stamp skipped: no database yet"
          fi
          find /backups -type f -mtime +14 -delete
          sleep 86400
        done

volumes:
  data:
